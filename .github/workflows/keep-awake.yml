# Pings the Render free web service so it doesn't sleep after 15 minutes idle.
# GitHub may delay scheduled runs, and disables them after 60 days with no
# repository activity (re-enable from the Actions tab).
name: Keep site awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping site
        env:
          PING_URL: ${{ vars.PING_URL || 'https://website-o022.onrender.com/' }}
        run: |
          # A cold start can take up to ~60s, so allow a long timeout and retry.
          curl --fail --silent --show-error --location \
            --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
            --output /dev/null --write-out "HTTP %{http_code} in %{time_total}s\n" \
            "$PING_URL"
